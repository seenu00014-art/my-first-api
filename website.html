<h1>My first website</h1>
<input id="nameInput" placeholder="New name" />
<button onclick="addUser()">Add users</button>
<button onclick="loadUsers()">see users</button>
<p id="result"></p>
<script>
async function loadUsers() {
  const res = await fetch('/users');
  const users = await res.json();
  document.getElementById('result').innerText = 'Get it: ' + users.map(u => u.name).join(' and ');
}
async function addUser() {
  const name = document.getElementById('nameInput').value;
  await fetch('/users', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({name: name}) });
  loadUsers();
}
</script>
